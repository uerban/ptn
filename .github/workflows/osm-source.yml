name: OSM source check
# The live upstream OSM download, kept out of the release chain. A weekly run
# reports when the mirror is unreachable or its extract stops parsing; it never
# blocks a release. A manual run with `publish` also replaces the pinned Vilnius
# clip that release validation builds from as a new immutable release; commit
# the printed pin to config/osm-release-fixture.json to adopt it.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the clip as the release-validation OSM fixture
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: osm-source
  cancel-in-progress: false

jobs:
  live-source:
    name: Download and clip the live Vilnius extract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          rust: 'false'
          wasm-pack: 'false'
      - name: Install OSM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pnpm install --frozen-lockfile
      - name: Download through the production snapshot path and clip
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/osm"
          pnpm --filter @pt/backend exec tsx scripts/refresh-osm-fixture.ts \
            "$RUNNER_TEMP/osm/work" "$RUNNER_TEMP/osm/vilnius.osm.pbf" | tee "$RUNNER_TEMP/osm/fixture.log"
          tail -n 1 "$RUNNER_TEMP/osm/fixture.log" > "$RUNNER_TEMP/osm/vilnius.osm.pbf.json"
          {
            echo '### Vilnius OSM clip'
            echo '```json'
            cat "$RUNNER_TEMP/osm/vilnius.osm.pbf.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osm-vilnius-clip
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/osm/vilnius.osm.pbf
            ${{ runner.temp }}/osm/vilnius.osm.pbf.json
          if-no-files-found: error

  publish-fixture:
    name: Publish the release-validation OSM fixture
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: live-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: osm-vilnius-clip
          path: clip
      - name: Publish as an immutable fixture release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          read -r sha stamp < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["sha256"], d["snapshotAt"])' clip/vilnius.osm.pbf.json)
          test "$sha" = "$(sha256sum clip/vilnius.osm.pbf | cut -d' ' -f1)"
          tag="osm-fixture-${stamp:0:10}"
          asset="vilnius-$sha.osm.pbf"
          cp clip/vilnius.osm.pbf "$asset"
          # Releases are immutable once published, so attach the asset to a
          # draft and publish it in one step.
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
            --title "OSM fixture ${stamp:0:10} (release validation)" \
            --notes "Pinned Vilnius OSM clip that release validation builds from. Not an application release. Source: Geofabrik lithuania-latest.osm.pbf, replication timestamp $stamp. Map data © OpenStreetMap contributors, available under the Open Database License (ODbL)." \
            "$asset"
          gh release edit "$tag" --draft=false
          {
            echo '### Pin for config/osm-release-fixture.json'
            echo '```json'
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({"source": d["source"], "url": f"https://github.com/{sys.argv[2]}/releases/download/{sys.argv[3]}/{sys.argv[4]}", "sha256": d["sha256"], "snapshotAt": d["snapshotAt"]}, indent=2))' \
              clip/vilnius.osm.pbf.json "$GITHUB_REPOSITORY" "$tag" "$asset"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
