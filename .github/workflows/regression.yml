name: Regression gates
run-name: Regression gates ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact 40-character source commit (defaults to workflow commit)
        required: false
        type: string
  # Labelled PRs run this inside their CI run (ci.yml); a PR trigger here would
  # add a skipped run per push and duplicate CI's call. Release drafting uses
  # manual dispatches on main.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: regressions-${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  regressions:
    name: Performance, memory and binding parity
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: source
    env:
      GATE_TOOLS: ${{ github.workspace }}/gate-tools
      SOURCE_REVISION: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
      CARGO_PROFILE_RELEASE_PANIC: abort
      CARGO_PROFILE_RELEASE_OPT_LEVEL: z
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          persist-credentials: false
      - name: Pin the measured source revision
        id: identity
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p evidence
      - uses: ./gate-tools/.github/actions/setup-build
        with:
          working-directory: source
          cache-profile: regression-size-optimized
          save-cache: ${{ github.ref == 'refs/heads/main' && (inputs.revision == '' || inputs.revision == github.sha) }}
      - name: Build browser bindings and native reference
        id: build
        run: |
          cd crates/pt-wasm
          wasm-pack build --release --target web --out-dir pkg-web
          wasm-pack build --release --target nodejs --out-dir pkg-node
          cd ../..
          pnpm install --frozen-lockfile
          cargo build --release --locked -p pt-core-emit -p pt-producer -p pt-serve
          pnpm --filter @pt/shared build
          pnpm --filter @pt/frontend build
      - name: WASM import and compressed-size budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: wasm
        run: node "$GATE_TOOLS/scripts/check-wasm-budgets.mjs" crates/pt-wasm/pkg-web/pt_wasm_bg.wasm evidence/wasm.json
      - name: Native and WASM routing goldens and binding parity
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: parity
        run: |
          set -o pipefail
          cargo test --locked -p pt-core --test raptor_behavior 2>&1 | tee evidence/routing-goldens.log
          node crates/pt-wasm/tests/plan_golden.mjs | tee evidence/wasm-goldens.log
          node crates/pt-wasm/tests/three_way.mjs | tee evidence/binding-parity.log
          grep -E 'pt-wasm-three-way: [1-9][0-9]* tuples compared, 0 mismatch' evidence/binding-parity.log
          pnpm --filter @pt/backend exec tsx ../shared/scripts/assert-ptb-cross-parity.ts ../../crates/pt-core/tests/tiny.projection.json ../../crates/pt-core/tests/canary.projection.json ../../crates/pt-core/tests/tiny-service-pool.projection.json ../../crates/pt-core/tests/tiny-v1.projection.json ../../crates/pt-core/tests/overnight-i32.projection.json 2>&1 | tee evidence/ptb-parity.log
      - name: Native RSS admission safeguards
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: rss
        run: |
          set -o pipefail
          cargo test --locked -p pt-serve --test rss_guard --test rss_guard_process --test generation_load_phases 2>&1 | tee evidence/rss.log
      - name: Index-build p99 budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: index
        run: |
          pnpm --filter @pt/frontend bench:check
          cd packages/frontend
          cp tests/benchmarks/.results.json ../../evidence/index-bench-raw.json
          PTN_BENCH_EVIDENCE=../../evidence/index-bench.json node "$GATE_TOOLS/packages/frontend/scripts/check-bench-budgets.mjs"
      - name: Browser bundle-size budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        id: bundle
        run: |
          set -o pipefail
          # Sizes are recorded even when a budget fails; size:check is the gate.
          pnpm --filter @pt/frontend --silent exec size-limit --json > evidence/bundle.json || true
          pnpm --filter @pt/frontend size:check 2>&1 | tee evidence/bundle.log
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @pt/frontend exec playwright install --with-deps chromium
      - name: Build browser measurement hooks
        id: measurement
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          VITE_E2E: "1"
        run: pnpm --filter @pt/frontend build
      - name: Browser JS heap budget
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.measurement.outcome == 'success' }}
        id: heap
        env:
          E2E_PREVIEW: "1"
          CI: "true"
        run: |
          pnpm --filter @pt/frontend exec playwright test --project=perf e2e/perf/memory-budget.spec.ts --retries=0 --reporter=json > evidence/browser-memory.json
          node "$GATE_TOOLS/scripts/check-browser-regressions.mjs" evidence/browser-memory.json 'JS heap stays under budget'
          cp packages/frontend/test-results/perf-metrics/heap.json evidence/heap.json
      - name: WASM cold-start p95 budgets
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.measurement.outcome == 'success' }}
        id: coldstart
        env:
          E2E_PREVIEW: "1"
          CI: "true"
          PTN_PERF_EVIDENCE_DIR: ${{ github.workspace }}/source/evidence
        run: |
          pnpm --filter @pt/frontend exec playwright test --project=pr-chromium --project=pr-chromium-throttled e2e/core/wasm-engine-coldstart.spec.ts --retries=0 --reporter=json > evidence/browser-coldstart.json
          node "$GATE_TOOLS/scripts/check-browser-regressions.mjs" evidence/browser-coldstart.json 'fast profile' 'real CDP CPU throttle'
      - name: Serve two synthetic cities through producer and pt-serve
        id: cities
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          nohup python3 "$GATE_TOOLS/scripts/regression/synthetic_cities.py" --bin-dir target/release \
            --work "$RUNNER_TEMP/synthetic-cities" --catalog "$RUNNER_TEMP/synthetic-cities.json" \
            > "$RUNNER_TEMP/synthetic-cities.log" 2>&1 &
          for _ in $(seq 1 600); do
            if [ -f "$RUNNER_TEMP/synthetic-cities.json" ]; then break; fi
            if ! kill -0 $! 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/synthetic-cities.log"
          test -f "$RUNNER_TEMP/synthetic-cities.json"
          cp "$RUNNER_TEMP/synthetic-cities.json" evidence/synthetic-cities.json
      - name: City switch and viewport pan workloads
        if: ${{ !cancelled() && steps.cities.outcome == 'success' && steps.browser.outcome == 'success' && steps.measurement.outcome == 'success' }}
        id: cityswitch
        env:
          E2E_PREVIEW: "1"
          CI: "true"
          PTN_SYNTHETIC_CITIES: ${{ runner.temp }}/synthetic-cities.json
        run: |
          pnpm --filter @pt/frontend exec playwright test --project=perf e2e/perf/city-switch.spec.ts --retries=0 --reporter=json > evidence/browser-city-switch.json
          node "$GATE_TOOLS/scripts/check-browser-regressions.mjs" evidence/browser-city-switch.json 'alternating city switches' 'viewport pans'
          cp packages/frontend/test-results/perf-metrics/city-switch.json packages/frontend/test-results/perf-metrics/viewport-pan.json evidence/
      - name: Retain synthetic city server logs
        if: ${{ always() && steps.cities.outcome != 'skipped' }}
        run: |
          mkdir -p evidence/synthetic-cities
          cp "$RUNNER_TEMP/synthetic-cities.log" evidence/synthetic-cities/ 2>/dev/null || true
          for log in "$RUNNER_TEMP"/synthetic-cities/*/*.log; do
            [ -f "$log" ] && cp "$log" "evidence/synthetic-cities/$(basename "$(dirname "$log")")-$(basename "$log")"
          done
          true
      - name: Record exact revision and gate outcomes
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 "$GATE_TOOLS/scripts/record-regression-evidence.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: regression-proof
          retention-days: 30
          if-no-files-found: error
          path: source/evidence/regression.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: regression-evidence
          retention-days: 30
          if-no-files-found: error
          # Benchmark output is a dot-file; upload-artifact skips those by default.
          include-hidden-files: true
          path: |
            source/evidence/
            source/packages/frontend/tests/benchmarks/.results.json
            source/packages/frontend/test-results/
