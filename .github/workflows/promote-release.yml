name: Promote immutable RC to stable draft
run-name: Promote ${{ inputs.source-rc }} to ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      source-rc:
        description: Published immutable RC tag (vX.Y.Z-rc.N)
        required: true
        type: string
      tag:
        description: Existing stable tag on the same commit (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Copy exact RC bytes and evidence; never dispatch a build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RC: ${{ inputs.source-rc }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/promote-release.py "$RELEASE_TAG" --from-rc "$SOURCE_RC"
