name: Promote prerelease to stable
run-name: Promote ${{ inputs.source-rc || inputs.tag }} to ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published prerelease vX.Y.N to mark stable and latest (or, with source-rc, the legacy stable tag vX.Y.Z)
        required: true
        type: string
      source-rc:
        description: Legacy only - published immutable RC tag (vX.Y.Z-rc.N) to copy to a stable draft
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Ensure GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh
          fi
          gh --version
      - name: Promote verified release bytes; never dispatch a build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RC: ${{ inputs.source-rc }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$SOURCE_RC" ]; then
            python3 scripts/promote-release.py "$RELEASE_TAG" --from-rc "$SOURCE_RC"
          else
            python3 scripts/promote-release.py "$RELEASE_TAG"
          fi
