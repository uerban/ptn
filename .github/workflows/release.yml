name: Release candidate validation
# Sole build for pushes to main ("build once"); ci.yml covers pull requests.

run-name: Release validation ${{ inputs.revision || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: Exact source commit to rebuild (defaults to workflow ref)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-validation-${{ inputs.revision || github.sha }}
  cancel-in-progress: false

env:
  RELEASE_REVISION: ${{ inputs.revision || github.sha }}

defaults:
  run:
    working-directory: source

jobs:
  build:
    name: Build and test release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_REVISION }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate-tools
          persist-credentials: false
      - uses: ./gate-tools/.github/actions/setup-build
        with:
          working-directory: source
          cache-profile: release-native
          save-cache: ${{ github.ref == 'refs/heads/main' && (!inputs.revision || inputs.revision == github.sha) }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config osmium-tool openjdk-21-jre-headless
      - name: Build the browser engine from clean source
        working-directory: source/crates/pt-wasm
        env:
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: wasm-pack build --release --target web --out-dir pkg-web
      - name: Build and test source
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/hosting-navigation.test.mjs scripts/ci-gates.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo build --release --locked --workspace
          cargo test --workspace --locked
          pnpm build
          pnpm test
          pnpm typecheck
          pnpm lint
      - name: Validate source-driven raw and recipe ingestion
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar \
            --output "$RUNNER_TEMP/gtfs-validator.jar"
          python3 scripts/verify-gtfs-recipes.py --work "$RUNNER_TEMP/gtfs-recipes" \
            --validator "$RUNNER_TEMP/gtfs-validator.jar"
      - name: Release completed native test outputs
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh target
          # All workspace tests passed; packaging consumes only release outputs.
          rm -rf target/debug
      - name: Install pinned x86_64 musl compiler
        run: bash scripts/install-musl-toolchain.sh x86_64-unknown-linux-musl
      - name: Build and package Linux x86_64 musl
        env:
          PT_SERVE_GIT_SHA: ${{ env.RELEASE_REVISION }}
          PT_PRODUCER_GIT_SHA: ${{ env.RELEASE_REVISION }}
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl \
            -p pt-serve -p pt-producer -p pt-artifacts -p pt-walk --features pt-walk/build
          node scripts/package-osm-builder.mjs
          python3 scripts/package-release.py --platform linux-x86_64 \
            --bin-dir target/x86_64-unknown-linux-musl/release
          tar -xzf release/ptn-linux-x86_64.tar.gz -C release
          python3 scripts/verify-release-tools.py --bundle release/ptn-linux-x86_64 --revision "$RELEASE_REVISION"
          cd release/ptn-linux-x86_64
          sha256sum --check SHA256SUMS
          python3 -c 'import json, os; r = json.load(open("release.json")); assert not r["sourceDirty"]; assert r["revision"] == os.environ["RELEASE_REVISION"]'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptn-release-inputs
          retention-days: 7
          path: |
            source/packages/frontend/dist/
            source/release-builder/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptn-linux-x86_64-candidate
          retention-days: 7
          compression-level: 0
          path: |
            source/release/ptn-linux-x86_64.tar.gz
            source/release/ptn-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  platforms:
    name: Package and smoke-test ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-armv6-rpi1
            target: arm-unknown-linux-musleabihf
            runner: ubuntu-24.04
            emulator: qemu-arm -cpu arm1176
          - platform: linux-aarch64-rpi3
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            emulator: qemu-aarch64 -cpu cortex-a53
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            emulator: ""
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            emulator: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_REVISION }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate-tools
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptn-release-inputs
          path: source
      - name: Install Linux build and emulation tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y perl pkg-config qemu-user binutils
          bash scripts/install-musl-toolchain.sh "$TARGET"
      - uses: ./gate-tools/.github/actions/setup-build
        with:
          working-directory: source
          node: 'false'
          wasm-pack: 'false'
          cache-profile: release-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/main' && (!inputs.revision || inputs.revision == github.sha) }}
      - name: Build all host tools
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          TARGET: ${{ matrix.target }}
          PT_SERVE_GIT_SHA: ${{ env.RELEASE_REVISION }}
          PT_PRODUCER_GIT_SHA: ${{ env.RELEASE_REVISION }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" \
            -p pt-serve -p pt-producer -p pt-artifacts -p pt-walk --features pt-walk/build
      - name: Verify Armv6 hard-float attributes
        if: matrix.platform == 'linux-armv6-rpi1'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for binary in pt-serve pt-producer pt-build-transfers pt-artifacts pt-walk-build pt-artifact-publish pt-transit pt-pack-inspect pt-pack-export pt-pack-catalog pt-pack-publish pt-pack-discovery; do
            path="target/$TARGET/release/$binary"
            readelf -h "$path" | grep -F 'hard-float ABI'
            attributes=$(readelf -A "$path")
            echo "$attributes"
            if echo "$attributes" | grep -q 'Tag_CPU_arch:'; then
              echo "$attributes" | grep -E 'Tag_CPU_arch: v6$'
            fi
          done
      - name: Package and execute archive tools
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EMULATOR: ${{ matrix.emulator }}
        run: |
          python3 scripts/package-release.py --platform "$PLATFORM" --bin-dir "target/$TARGET/release"
          tar -xzf "release/ptn-$PLATFORM.tar.gz" -C release
          python3 scripts/verify-release-tools.py --bundle "release/ptn-$PLATFORM" --runner "$EMULATOR" --revision "$RELEASE_REVISION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptn-${{ matrix.platform }}
          retention-days: 30
          compression-level: 0
          path: |
            source/release/ptn-${{ matrix.platform }}.tar.gz
            source/release/ptn-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error

  prepare-validation:
    name: Prepare signed hosting inputs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_REVISION }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate-tools
          persist-credentials: false
      - uses: ./gate-tools/.github/actions/setup-build
        with:
          working-directory: source
          rust: 'false'
          wasm-pack: 'false'
          save-cache: ${{ github.ref == 'refs/heads/main' && (!inputs.revision || inputs.revision == github.sha) }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptn-linux-x86_64-candidate
          path: source/release
      - name: Install validation tools and verify release
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool openjdk-21-jre-headless
          pnpm install --frozen-lockfile
          cd release
          sha256sum --check ptn-linux-x86_64.tar.gz.sha256
          tar -xzf ptn-linux-x86_64.tar.gz
          cd ptn-linux-x86_64
          sha256sum --check SHA256SUMS
          python3 -c 'import json, os; r = json.load(open("release.json")); assert not r["sourceDirty"]; assert r["revision"] == os.environ["RELEASE_REVISION"]'
      - name: Check disk capacity before OSM extraction
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          python3 - <<'PYTHON'
          import os
          import shutil
          path = os.environ["RUNNER_TEMP"]
          free = shutil.disk_usage(path).free
          minimum = 6 * 1024**3
          print(f"OSM/hosting scratch available: {free / 1024**3:.1f} GiB")
          if free < minimum:
              raise SystemExit("Need at least 6 GiB free for reference-city OSM and hosting validation")
          PYTHON
      - name: Build a local signed OSM catalog from the extracted archive
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ptn-evidence"
          bundle="$GITHUB_WORKSPACE/source/release/ptn-linux-x86_64"
          node "$bundle/examples/native/prepare-osm.mjs" "$RUNNER_TEMP/ptn-osm"
          PT_ADDRESS_EXTRACT_SCRIPT="$bundle/builder/packages/backend/scripts/extract-addr-fixture.mjs" \
            node "$bundle/builder/packages/backend/src/poi/buildArtifacts.mjs" "$RUNNER_TEMP/ptn-osm/builder.json" \
              2>&1 | tee "$RUNNER_TEMP/ptn-evidence/osm-build.log"
      - name: Share only signed public hosting inputs
        run: |
          tar -czf "$RUNNER_TEMP/hosting-inputs.tar.gz" -C "$RUNNER_TEMP/ptn-osm" repository artifact-source.json
          cd "$RUNNER_TEMP"
          sha256sum hosting-inputs.tar.gz > hosting-inputs.tar.gz.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hosting-inputs
          retention-days: 7
          compression-level: 0
          path: |
            ${{ runner.temp }}/hosting-inputs.tar.gz
            ${{ runner.temp }}/hosting-inputs.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hosting-input-preparation
          retention-days: 14
          path: ${{ runner.temp }}/ptn-evidence/osm-build.log
          if-no-files-found: warn

  validate:
    name: Validate ${{ matrix.kind }} on a fresh host
    needs: [build, prepare-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        kind: [native, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_REVISION }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: gate-tools
          persist-credentials: false
      - uses: ./gate-tools/.github/actions/setup-build
        with:
          working-directory: source
          rust: 'false'
          wasm-pack: 'false'
          save-cache: ${{ github.ref == 'refs/heads/main' && (!inputs.revision || inputs.revision == github.sha) }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptn-linux-x86_64-candidate
          path: source/release
      - name: Install validation tools and verify release
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool openjdk-21-jre-headless
          pnpm install --frozen-lockfile
          cd release
          sha256sum --check ptn-linux-x86_64.tar.gz.sha256
          tar -xzf ptn-linux-x86_64.tar.gz
          cd ptn-linux-x86_64
          sha256sum --check SHA256SUMS
          python3 -c 'import json, os; r = json.load(open("release.json")); assert not r["sourceDirty"]; assert r["revision"] == os.environ["RELEASE_REVISION"]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hosting-inputs
          path: ${{ runner.temp }}
      - name: Restore signed hosting inputs
        run: |
          cd "$RUNNER_TEMP"
          sha256sum --check hosting-inputs.tar.gz.sha256
          mkdir ptn-osm
          tar -xzf hosting-inputs.tar.gz -C ptn-osm
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "ptn-osm"
          path = root / "artifact-source.json"
          config = json.loads(path.read_text())
          assert config["artifactSource"]["kind"] == "local"
          config["artifactSource"]["directory"] = str(root / "repository")
          path.write_text(json.dumps(config))
          PYTHON
      - name: Install browser
        run: pnpm --filter @pt/frontend exec playwright install --with-deps chromium
      - name: Install native test web server
        if: matrix.kind == 'native'
        run: |
          docker pull caddy:2.11.7-alpine
          container=$(docker create caddy:2.11.7-alpine)
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          docker rm "$container"
      - name: Validate native fresh-host lifecycle over HTTP and TLS
        if: matrix.kind == 'native'
        run: |
          python3 scripts/verify-native-installation.py \
            --bundle release/ptn-linux-x86_64 \
            --source-config "$RUNNER_TEMP/ptn-osm/artifact-source.json" \
            --caddy "$RUNNER_TEMP/caddy" --evidence "$RUNNER_TEMP/ptn-evidence/native"
      - name: Validate Docker fresh-host lifecycle over HTTP and TLS
        if: matrix.kind == 'docker'
        run: |
          python3 scripts/verify-docker-installation.py \
            --source-config "$RUNNER_TEMP/ptn-osm/artifact-source.json" \
            --evidence "$RUNNER_TEMP/ptn-evidence/docker"
      - name: Report validation disk usage
        if: always()
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          du -sh "$RUNNER_TEMP/ptn-osm" "$RUNNER_TEMP/ptn-evidence" release 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hosting-${{ matrix.kind }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/ptn-evidence/**/*.log
            ${{ runner.temp }}/ptn-evidence/**/result.json
            ${{ runner.temp }}/ptn-evidence/**/*.png
          if-no-files-found: warn

  security:
    name: Security scans
    # PRs are scanned by CI; this covers direct pushes to main.
    if: github.event_name == 'push'
    uses: ./.github/workflows/security.yml
    with:
      audit-dependencies: true

  validated-archive:
    name: Retain archive after both hosting validations
    needs: [build, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ptn-linux-x86_64-candidate
          path: release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptn-linux-x86_64
          retention-days: 30
          compression-level: 0
          path: |
            release/ptn-linux-x86_64.tar.gz
            release/ptn-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
