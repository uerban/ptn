name: CI
run-name: CI ${{ github.head_ref || github.ref_name }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.scope.outputs.source }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check CI scope policy
        run: python3 -m unittest discover -s scripts -p test_ci_scope.py
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci-scope.py --event "$EVENT_NAME" --payload "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
  source:
    name: Build and test source
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config osmium-tool
      - uses: ./.github/actions/setup-build
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the browser engine
        working-directory: crates/pt-wasm
        env:
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: wasm-pack build --release --target web --out-dir pkg-web
      - name: Build and test source
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/hosting-navigation.test.mjs scripts/ci-gates.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo build --release --locked --workspace
          cargo test --workspace --locked
          pnpm build
          pnpm test
          pnpm typecheck
          pnpm lint
  platforms:
    name: Build and smoke-test ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            emulator: ""
          - platform: linux-armv6-rpi1
            target: arm-unknown-linux-musleabihf
            runner: ubuntu-24.04
            emulator: qemu-arm -cpu arm1176
          - platform: linux-aarch64-rpi3
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            emulator: qemu-aarch64 -cpu cortex-a53
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            emulator: ""
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            emulator: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux build and emulation tools
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y perl pkg-config qemu-user binutils
          bash scripts/install-musl-toolchain.sh "$TARGET"
      - uses: ./.github/actions/setup-build
        with:
          node: 'false'
          wasm-pack: 'false'
          cache-profile: release-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build all host tools
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          TARGET: ${{ matrix.target }}
          PT_SERVE_GIT_SHA: ${{ github.sha }}
          PT_PRODUCER_GIT_SHA: ${{ github.sha }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET" \
            -p pt-serve -p pt-producer -p pt-artifacts -p pt-walk --features pt-walk/build
      - name: Verify Armv6 hard-float attributes
        if: matrix.platform == 'linux-armv6-rpi1'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for binary in pt-serve pt-producer pt-build-transfers pt-artifacts pt-walk-build pt-artifact-publish; do
            path="target/$TARGET/release/$binary"
            readelf -h "$path" | grep -F 'hard-float ABI'
            attributes=$(readelf -A "$path")
            echo "$attributes"
            if echo "$attributes" | grep -q 'Tag_CPU_arch:'; then
              echo "$attributes" | grep -E 'Tag_CPU_arch: v6$'
            fi
          done
      - name: Verify compiled tools without packaging release assets
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EMULATOR: ${{ matrix.emulator }}
        run: |
          python3 scripts/verify-release-tools.py --bin-dir "target/$TARGET/release" \
            --platform "$PLATFORM" --runner "$EMULATOR"

  security:
    name: Security scans
    needs: changes
    uses: ./.github/workflows/security.yml
    with:
      audit-dependencies: ${{ needs.changes.outputs.dependencies == 'true' }}
  regression:
    name: Regression gates
    # Optional diagnostics for labelled PRs; not part of the required result.
    # The label takes effect on the next push (or dispatch regression.yml).
    needs: changes
    if: >-
      github.event_name == 'pull_request' && needs.changes.outputs.source == 'true' &&
      contains(github.event.pull_request.labels.*.name, 'ci:regression')
    uses: ./.github/workflows/regression.yml
  result:
    name: CI
    needs: [changes, source, platforms, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require success or a deliberate prose-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SOURCE_REQUIRED: ${{ needs.changes.outputs.source }}
          SOURCE_RESULT: ${{ needs.source.result }}
          PLATFORM_RESULT: ${{ needs.platforms.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$SECURITY_RESULT" = success
          if [ "$SOURCE_REQUIRED" = true ]; then
            test "$SOURCE_RESULT" = success
            test "$PLATFORM_RESULT" = success
          else
            test "$SOURCE_REQUIRED" = false
            test "$SOURCE_RESULT" = skipped
            test "$PLATFORM_RESULT" = skipped
          fi
