name: CI
run-name: CI ${{ github.head_ref || github.ref_name }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.scope.outputs.source }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check CI scope policy
        run: python3 -m unittest discover -s scripts -p test_ci_scope.py
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci-scope.py --event "$EVENT_NAME" --payload "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT"
  source:
    name: Build and test source
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config osmium-tool
      - uses: ./.github/actions/setup-build
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the browser engine
        working-directory: crates/pt-wasm
        env:
          CARGO_PROFILE_RELEASE_PANIC: abort
          CARGO_PROFILE_RELEASE_OPT_LEVEL: z
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: wasm-pack build --release --target web --out-dir pkg-web
      - name: Build and test source
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/hosting-navigation.test.mjs scripts/ci-gates.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo build --release --locked --workspace
          cargo test --workspace --locked
          pnpm build
          pnpm test
          pnpm typecheck
          pnpm lint
  security:
    name: Security scans
    needs: changes
    uses: ./.github/workflows/security.yml
    with:
      audit-dependencies: ${{ needs.changes.outputs.dependencies == 'true' }}
  result:
    name: CI
    needs: [changes, source, security]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require success or a deliberate prose-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SOURCE_REQUIRED: ${{ needs.changes.outputs.source }}
          SOURCE_RESULT: ${{ needs.source.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$SECURITY_RESULT" = success
          if [ "$SOURCE_REQUIRED" = true ]; then
            test "$SOURCE_RESULT" = success
          else
            test "$SOURCE_REQUIRED" = false
            test "$SOURCE_RESULT" = skipped
          fi
