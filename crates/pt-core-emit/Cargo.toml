[package]
name = "pt-core-emit"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"

# A separate `std` crate depending on `pt-core` — NOT a feature-gated bin inside `pt-core`. A
# feature could be unified on by `pt-wasm`/`pt-serve` and pull `std` into `pt-core`, breaking the
# `no_std` purity P5 needs; the sibling crate makes the boundary compiler-enforced.

[[bin]]
name = "pt-core-emit"
path = "src/main.rs"

[features]
temporal-experiment = ["pt-core/temporal-experiment"]

[dependencies]
pt-core = { path = "../pt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
pt-core = { path = "../pt-core", features = ["test-helpers"] }
