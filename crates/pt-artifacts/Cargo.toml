[package]
name = "pt-artifacts"
default-run = "pt-artifacts"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
pt-shared = { path = "../pt-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
rustix = { version = "0.38", features = ["fs"] }
pt-geocode = { path = "../pt-geocode" }
pt-walk = { path = "../pt-walk" }
flate2 = "1"
brotli = "7"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
clap = { version = "4", features = ["derive"] }
jiff.workspace = true

[dev-dependencies]
tempfile = "3"
