name: ptn-reference
services:
  transit:
    image: ptn-reference-host:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/host.Dockerfile
    volumes:
      - ${PTN_CONFIG_DIR:?Set PTN_CONFIG_DIR to an absolute directory}:/config:ro
      - state:/var/lib/ptn
      - ${PTN_OSM_REPOSITORY:?Set PTN_OSM_REPOSITORY to the local catalog directory}:/osm-repository:ro
    restart: unless-stopped
  refresh:
    image: ptn-reference-host:local
    platform: linux/amd64
    command: [refresh-loop]
    volumes:
      - ${PTN_CONFIG_DIR}:/config:ro
      - state:/var/lib/ptn
      - ${PTN_OSM_REPOSITORY}:/osm-repository:ro
    restart: unless-stopped
  web:
    image: docker.io/library/caddy:2.11.7-alpine
    environment:
      PTN_SITE: ${PTN_SITE:-http://localhost:8080}
      PTN_WEB_ROOT: /srv/web
      PTN_ARTIFACT_PUBLIC: /var/lib/ptn/artifacts/public
      PTN_MAIN: transit:9000
      PTN_AUX: transit:9001
    ports:
      - "127.0.0.1:${PTN_HTTP_PORT:-8080}:8080"
    volumes:
      - ../release/ptn-linux-x86_64/web:/srv/web:ro
      - ../examples/native/Caddyfile:/etc/caddy/Caddyfile:ro
      - state:/var/lib/ptn:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
volumes:
  state:
  caddy-data:
  caddy-config:
